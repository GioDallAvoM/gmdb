<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gmdb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: manifesto costruttivista su carta da protocollo. Fascia nera con diagonale rossa e stella, filetti spessi e doppi, schede come fascicoli */
:root{
  --paper:#ECE3CC; --tile:#F4EEDD; --tile-2:#E2D7BC; --ink:#1B1815; --red:#B3171F; --muted:#6A5F4E;
  --line:#C3B595; --star-off:#CDBF9F; --on-red:#F4EEDD;
  --band:#1B1815; --band-fg:#ECE3CC; --band-muted:#A99C86;
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Serif",Georgia,serif;
  --f-mono:"Courier Prime","Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161412; --tile:#211E1A; --tile-2:#2B2723; --ink:#ECE3CC; --red:#D8262E; --muted:#A99C86;
  --line:#3B352D; --star-off:#433C33; --on-red:#F4EEDD; --band:#0C0B0A; --band-fg:#ECE3CC; --band-muted:#A99C86; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161412; --tile:#211E1A; --tile-2:#2B2723; --ink:#ECE3CC; --red:#D8262E; --muted:#A99C86;
  --line:#3B352D; --star-off:#433C33; --on-red:#F4EEDD; --band:#0C0B0A; --band-fg:#ECE3CC; --band-muted:#A99C86; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.star{width:28px;height:28px;flex:0 0 auto;background:var(--red);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}

/* fascia */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-fg);overflow:hidden}
header::after{content:"";position:absolute;right:-70px;top:0;width:min(360px,42%);height:100%;background:var(--red);transform:skewX(-28deg);pointer-events:none}
.bar{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding-block:12px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-family:var(--f-display);font-weight:600;font-size:34px;letter-spacing:.12em;line-height:1}
.brand small{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--band-muted);text-transform:uppercase}
.kind{background:transparent;border:2px solid var(--band-fg);color:var(--band-fg);border-radius:0;padding:5px 8px;font-family:var(--f-display);font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.kind option{background:var(--band);color:var(--band-fg)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--band-fg);font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;cursor:pointer;border-radius:0}
nav button[aria-selected="true"]{background:var(--band-fg);color:var(--band)}
nav button:hover:not([aria-selected="true"]){text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}

main{padding-block:26px 64px}
h2{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,5vw,44px);letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.02;text-wrap:balance;border-top:6px solid var(--ink);padding-top:12px}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch}

/* filtri */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:20px 0 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld input,.fld select{background:var(--tile);border:2px solid var(--ink);border-radius:0;padding:7px 10px;width:100%;min-width:0;font-size:15px}
.fld.wide{grid-column:1/-1}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}
.count{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.btn{background:var(--tile);border:2px solid var(--ink);border-radius:0;padding:5px 12px;cursor:pointer;font-family:var(--f-display);font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.btn:hover{background:var(--ink);color:var(--paper)}
select.btn:hover{background:var(--tile);color:var(--ink)}

/* elenco */
.list{display:flex;flex-direction:column;border-top:4px solid var(--ink);border-bottom:4px solid var(--ink)}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 6px;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--tile)}
.yr{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.ttl{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.ttl em{font-family:var(--f-mono);font-style:normal;color:var(--muted);font-weight:400;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.right{display:flex;align-items:center;gap:14px}
.score{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1;color:var(--red);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.prog{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.prog i{display:block;width:64px;height:5px;background:var(--star-off);overflow:hidden}
.prog i span{display:block;height:100%;background:var(--ink)}
.prog small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:0 6px;border:1px solid var(--muted);color:var(--muted);margin-left:8px;vertical-align:2px}
.more{margin:16px auto 0;display:block}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-style:italic}

/* consiglia */
.catpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.catpick button{background:var(--tile);border:2px solid var(--ink);border-radius:0;padding:4px 11px;cursor:pointer;font-size:14px}
.catpick button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mins{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.min{background:var(--tile);border-left:6px solid var(--red);padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.min div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.min input{width:100%;accent-color:var(--red)}
.reason{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.reason b{color:var(--red)}

/* premi */
.seg{display:inline-flex;border:2px solid var(--ink)}
.seg button{border:0;background:var(--tile);padding:5px 14px;cursor:pointer;font-family:var(--f-display);font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:14px;border-radius:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.years{display:flex;gap:4px;overflow-x:auto;padding:16px 0 8px;scrollbar-width:thin}
.years button{flex:0 0 auto;font-family:var(--f-mono);font-size:14px;border:2px solid var(--ink);background:var(--tile);border-radius:0;padding:4px 8px;cursor:pointer}
.years button[aria-pressed="true"]{background:var(--red);color:var(--on-red);border-color:var(--red);font-weight:700}
.yearhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:16px 0;border-bottom:4px double var(--ink);padding-bottom:8px}
.yearhead .num{font-family:var(--f-display);font-weight:600;font-size:72px;line-height:.9;color:var(--red)}
.yearhead .sub{font-family:var(--f-mono);font-size:14px;margin:0}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.award{background:var(--tile);border-left:6px solid var(--red);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.award.top{grid-column:1/-1;background:var(--band);color:var(--band-fg);border-left-color:var(--red);position:relative;overflow:hidden}
.award.top::after{content:"";position:absolute;right:-50px;top:0;width:min(200px,30%);height:100%;background:var(--red);transform:skewX(-28deg);opacity:.9}
.award.top>*{position:relative;z-index:1}
.award .cat{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.award.top .cat{font-size:22px}
.win{display:flex;gap:10px;align-items:flex-start}
.win .statue{flex:0 0 auto;width:22px;height:22px;color:var(--red);margin-top:2px}
.win .who{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.award.top .win .who{font-family:var(--f-display);font-weight:600;font-size:28px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.win .of{font-size:14px;color:var(--muted)}
.award.top .win .of{color:var(--band-muted)}
.noms{list-style:none;margin:0;padding:8px 0 0;border-top:1px dashed var(--muted);display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted)}
.award.top .noms{border-color:var(--band-muted);color:var(--band-muted);max-width:70%}
.noms li{display:flex;justify-content:space-between;gap:8px}
.noms li span:first-child{min-width:0;overflow-wrap:anywhere}
.nowin{color:var(--muted);font-size:14px;font-style:italic}
.award.top .nowin{color:var(--band-muted)}
.link{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;font:inherit}
.link:hover{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px}
.tablewrap{overflow-x:auto;border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);margin-top:14px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-top:0;border-bottom:2px solid var(--ink)}
td.y{font-family:var(--f-mono);color:var(--red);font-weight:700;width:70px}
.note{background:var(--tile-2);border-left:6px solid var(--red);padding:10px 12px;font-size:14px;margin:12px 0 0}

/* scheda */
.scrim{position:fixed;inset:0;background:rgba(12,11,10,.6);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--paper);width:min(760px,100%);height:100%;overflow-y:auto;overflow-x:hidden;padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
.sheet-head{background:var(--band);color:var(--band-fg);padding:12px max(18px,env(safe-area-inset-right,0px)) 12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:3;overflow:hidden}
.sheet-head::after{content:"";position:absolute;right:-50px;top:0;width:min(220px,38%);height:100%;background:var(--red);transform:skewX(-28deg)}
.sheet-head>*{position:relative;z-index:1}
.sheet-head .brand b{font-size:24px}
.sheet-head .no{font-family:var(--f-mono);font-size:13px;color:var(--band-muted);letter-spacing:.04em}
.x{margin-left:auto;background:var(--band);border:2px solid var(--band-fg);color:var(--band-fg);border-radius:0;width:38px;height:38px;cursor:pointer;flex:0 0 auto;font-size:18px;line-height:1}
.x:hover{background:var(--band-fg);color:var(--band)}
.sheet-body{padding:22px 20px 0;display:flex;flex-direction:column;gap:30px}
.fhead{border-top:none;background:linear-gradient(var(--ink),var(--ink)) top/100% 6px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 9px/100% 2px no-repeat;padding-top:22px}
.meta-top{font-family:var(--f-mono);font-size:14px;display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;color:var(--muted);text-transform:uppercase}
.fhead h3{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,7vw,58px);line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:12px 0 6px;text-wrap:balance;overflow-wrap:anywhere}
.orig{font-family:var(--f-mono);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.by{font-style:italic;margin-top:8px}
.top{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:30px;align-items:start}
.mine{background:var(--red);color:var(--on-red);padding:14px 18px 20px;transform:rotate(-2.5deg);position:relative;margin:6px 10px 18px 4px}
.mine .n{font-family:var(--f-display);font-weight:600;font-size:96px;line-height:.95;font-variant-numeric:tabular-nums}
.mine .n small{font-size:30px}
.stamp{position:absolute;right:-12px;bottom:-18px;border:3px solid var(--ink);color:var(--ink);background:var(--paper);font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.2em;padding:2px 10px;transform:rotate(-11deg)}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0}
dt{font-family:var(--f-display);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:14px;padding-top:2px}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
dd a{color:var(--red);text-underline-offset:3px}
dd a:hover{text-decoration-thickness:2px}
.sec{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.08em;text-transform:uppercase;border-bottom:4px double var(--ink);padding-bottom:4px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:13px;height:13px;flex:0 0 auto;background:var(--red);transform:rotate(45deg)}
.sec small{margin-left:auto;font-family:var(--f-mono);font-weight:400;font-size:12px;letter-spacing:.02em;text-transform:none;color:var(--muted)}

/* voti esterni: sempre su una riga, si rimpiccioliscono con lo spazio */
.extwrap{container-type:inline-size}
.ext{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:clamp(4px,1.6cqi,10px)}
.ev{background:var(--tile);border-top:5px solid var(--red);padding:clamp(6px,2.2cqi,14px) clamp(3px,1.4cqi,10px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(3px,1cqi,6px);min-width:0;color:inherit;text-decoration:none}
a.ev:hover{outline:2px solid var(--ink)}
.ev .src{height:clamp(11px,4.4cqi,22px);width:100%;display:flex;align-items:center;justify-content:center}
.ev .src svg{height:100%;width:auto;max-width:100%;display:block}
.ev .src .cmp{display:none}
.ev .num{font-family:var(--f-display);font-weight:600;font-size:clamp(16px,6cqi,32px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .num small{font-family:var(--f-mono);font-weight:400;font-size:clamp(9px,2.4cqi,13px);color:var(--muted);margin-left:1px}
.ev .on10{font-family:var(--f-mono);font-size:clamp(9px,2.3cqi,12px);color:var(--muted);line-height:1.2}
.ev.avg{background:var(--ink);color:var(--paper);border-top-color:var(--ink)}
.ev.avg .src{font-family:var(--f-display);font-weight:600;font-size:clamp(10px,3cqi,15px);letter-spacing:.14em;text-transform:uppercase}
.ev.avg .num small,.ev.avg .on10{color:var(--paper);opacity:.75}
@container (max-width:520px){ .ev .src .full.wide{display:none} .ev .src .cmp{display:block} }
:root[data-theme="dark"] .ev .src .lt,:root[data-theme="dark"] .ev .src .mb{fill:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ev .src .lt,:root:not([data-theme="light"]) .ev .src .mb{fill:#fff}}

/* trailer */
.trailer{position:relative;display:block;aspect-ratio:16/9;max-width:100%;overflow:hidden;border:3px solid var(--ink);background:var(--band);color:var(--band-fg)}
.trailer::before{content:"";position:absolute;right:-12%;top:0;width:34%;height:100%;background:var(--red);transform:skewX(-28deg)}
.trailer .play{border:0;cursor:pointer;padding:0;width:68px;height:68px;border-radius:50%;background:var(--red);color:var(--on-red);display:grid;place-items:center;position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:2;box-shadow:0 0 0 6px var(--band),0 0 0 8px var(--band-fg)}
.trailer .play:hover{background:var(--band-fg);color:var(--band)}
.trailer .tt{position:absolute;left:16px;right:16px;top:calc(42% + 52px);text-align:center;font-family:var(--f-display);font-weight:600;font-size:clamp(17px,3.4vw,24px);letter-spacing:.06em;text-transform:uppercase;line-height:1.1;color:var(--band-fg);text-decoration:none;z-index:2}
.trailer a.tt:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.trailer .tt small{display:block;font-family:var(--f-mono);font-weight:400;font-size:12px;letter-spacing:.08em;color:var(--band-muted);margin-top:5px}
.trailer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3}

/* voti per categoria e modifica */
.cats{border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.c{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:6px 14px;padding:10px 4px;border-top:1px solid var(--line);align-items:center}
.c:first-child{border-top:0}
.c .nm{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.c .nm small{display:block;font-family:var(--f-mono);letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.stars{display:flex;align-items:center;gap:1px;flex-wrap:wrap}
.stars button{background:none;border:0;padding:2px;cursor:pointer;color:var(--star-off);line-height:0}
.stars button.on{color:var(--red)}
.stars button svg{width:21px;height:21px}
.stars .val{font-family:var(--f-mono);font-weight:700;font-size:14px;margin-left:8px;min-width:34px}
.stars[aria-disabled="true"] button{cursor:default}
.c input[type=text],.c select{grid-column:2;background:var(--tile);border:2px solid var(--ink);border-radius:0;padding:5px 9px;width:100%;min-width:0;font-size:14px}
.castbox{grid-column:2;display:flex;flex-direction:column;gap:6px;min-width:0}
.castbox input[type=text],.castbox select{background:var(--tile);border:2px solid var(--ink);border-radius:0;padding:5px 9px;width:100%;min-width:0;font-size:14px}
.castpick{display:flex;align-items:center;gap:8px}
.castpick select{width:auto;flex:1}
.ibs{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--tile-2);border-left:6px solid var(--red);padding:7px 10px;color:var(--ink);text-decoration:none;font-size:14px}
.ibs:hover{outline:2px solid var(--ink)}
.ibs .buy{font-family:var(--f-display);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--red);white-space:nowrap}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--band);color:var(--band-fg);border:2px solid var(--band-fg);padding:6px 14px;font-family:var(--f-mono);font-size:14px;z-index:30}

@media (max-width:620px){
  .brand b{font-size:28px} .brand small{display:none} nav{margin-left:0;width:100%} nav button{font-size:17px;padding:4px 9px}
  .row{grid-template-columns:44px minmax(0,1fr) auto;gap:10px}
  .prog{display:none}
  .top{grid-template-columns:1fr} .mine{max-width:240px}
  dl{grid-template-columns:1fr;gap:2px} dd{margin-bottom:10px}

const LB_CMP=`<svg class="cmp" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Letterboxd" viewBox="0 0 97.24 36"><ellipse fill="#40bcf4" cx="79.21" cy="18" rx="18.03" ry="18"/><ellipse fill="#00e054" cx="48.62" cy="18" rx="18.03" ry="18"/><ellipse fill="#ff8000" cx="18.03" cy="18" rx="18.03" ry="18"/><path class="lt" fill="#556677" d="M 33.3,27.5 C 31.6,24.8 30.6,21.5 30.6,18 c 0,-3.5 1,-6.8 2.7,-9.5 1.7,2.8 2.7,6 2.7,9.5 0,3.5 -1,6.8 -2.7,9.5 z"/><path class="lt" fill="#556677" d="m 63.9,8.5 c 1.7,2.8 2.7,6 2.7,9.5 0,3.5 -1,6.8 -2.7,9.5 C 62.2,24.8 61.2,21.5 61.2,18 c 0,-3.5 1,-6.8 2.7,-9.5 z"/></svg>`;
function logoOf(src){ return src==="lb" ? LOGO.lb.replace("<svg ",'<svg class="full wide" ')+LB_CMP : LOGO[src]; }
// Media e voti esterni su un'unica riga; i dati mancanti non compaiono
function extHTML(f){
  const e=extOf(f); const imdb = typeof e.imdb==="number" ? e.imdb : f.imdb;
  const m=mediaExt(f);
  // num = valore nella scala della fonte, d = decimali, k = fattore per portarlo su 10
  const tile=(src,num,d,suf,k,url)=>{
    if(typeof num!=="number") return "";
    const inner=`<span class="src" title="${NAME[src]}">${logoOf(src)}</span><span class="num">${num.toFixed(d).replace(".",",")}<small>${suf}</small></span><span class="on10">${fmt1(num*k)} su 10</span>`;
    return url ? `<a class="ev" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="ev">${inner}</div>`;
  };
  const tiles=[
    m?`<div class="ev avg"><span class="src">Media</span><span class="num">${fmt1(m.v)}<small>/10</small></span><span class="on10">${m.n} ${m.n===1?"fonte":"fonti"}</span></div>`:"",
    tile("imdb", imdb, 1, "/10", 1, `https://www.imdb.com/title/${f.id}/`),
    tile("mym", e.mym, 2, "/5", 2, e.mym_url),
    tile("rt", e.rt, 0, "%", .1, e.rt_url),
    tile("lb", e.lb, 2, "/5", 2, e.lb_url),
  ].filter(Boolean);
  if(!tiles.length) return "";
  return `<div class="extwrap"><div class="ext" style="--n:${tiles.length}">${tiles.join("")}</div></div>`;
}
// Il player YouTube si può incorporare solo quando il sito è pubblicato su un dominio proprio:
// le pagine ospitate su claude.ai bloccano i video di altri siti, e lì il play apre YouTube.
const CAN_EMBED = location.protocol==="https:" && !!location.hostname && !/(^|\.)(claude\.ai|claudeusercontent\.com|anthropic\.com)$/i.test(location.hostname);
function trailerHTML(f){
  const e=extOf(f);
  if(!e.yt) return "";
  const id=esc(e.yt);
  const url=`https://www.youtube.com/watch?v=${id}`;
  const lang=e.yt_lang==="it"?"Trailer italiano":"Trailer originale";
  return `<div class="trailer" data-trailer="${id}">
      <button type="button" class="play" data-play aria-label="Guarda il trailer di ${esc(f.t)}"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
      <a class="tt" href="${url}" target="_blank" rel="noopener" title="Apri su YouTube">${esc(f.t)}<small>${lang} · YouTube ↗</small></a>
    </div>`;
}
function bindTrailer(root){
  root.querySelectorAll("[data-trailer]").forEach(t=>{
    const play=t.querySelector("[data-play]"); if(!play) return;
    play.addEventListener("click",ev=>{
      ev.preventDefault();
      if(!CAN_EMBED){ // claude.ai blocca i video di altri siti: il play non porta mai fuori
        const s=t.querySelector(".tt small"); if(s) s.textContent="Qui il video non parte: partirà sul sito Gmdb";
        return;
      }
      const fr=document.createElement("iframe");
      fr.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(t.dataset.trailer)}?autoplay=1&rel=0&hl=it`;
      fr.title="Trailer"; fr.allow="autoplay; encrypted-media; picture-in-picture; fullscreen"; fr.allowFullscreen=true;
      fr.referrerPolicy="strict-origin-when-cross-origin";
      t.appendChild(fr);
    });
  });
}
function info(f){ const d=DEF[f.id]; const base=d?{cast:d.c,eta:d.e}:{}; return {...base, ...(VOTI[f.id]||{})}; }
function filled(f){ const v=VOTI[f.id]?.v||{}; return EDIT_CATS.filter(c=>typeof v[c.k]==="number").length; }
function avgCats(f){ const v=VOTI[f.id]?.v||{}; const a=EDIT_CATS.map(c=>v[c.k]).filter(x=>typeof x==="number"); return a.length? a.reduce((s,x)=>s+x,0)/a.length : null; }
function pool(){ return FILMS.filter(f=> S.kind==="serie" ? f.serie : !f.serie); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,1800); }

/* ---------- filters ---------- */
function applyFilters(list){
  const q=norm(S.q), at=norm(S.attore), rg=norm(S.regista);
  return list.filter(f=>{
    if(q && !norm(f.t+" "+f.o).includes(q)) return false;
    if(S.anno && String(f.y)!==S.anno) return false;
    if(S.genere && !f.g.includes(S.genere)) return false;
    if(rg && !norm(f.d).includes(rg)) return false;
    const i=info(f);
    if(S.nazione && !nazioni(f).includes(S.nazione)) return false;
    if(at){ const names=[...(i.cast||[]), ...Object.values(i.n||{}), ...attori(f), ...attrici(f)]; if(!names.some(n=>norm(n).includes(at))) return false; }
    if(S.eta!==""){ if(typeof i.eta!=="number" || i.eta>Number(S.eta)) return false; }
    return true;
  });
}
function filterBar(withSearch){
  const list=pool();
  const years=[...new Set(list.map(f=>f.y).filter(Boolean))].sort((a,b)=>b-a);
  const genres=[...new Set(list.flatMap(f=>f.g))].sort((a,b)=>a.localeCompare(b,"it"));
  const nations=[...new Set(list.flatMap(f=>nazioni(f)))].sort((a,b)=>a.localeCompare(b,"it"));
  const directors=[...new Set(list.flatMap(f=>f.d.split(",").map(s=>s.trim())).filter(Boolean))].sort();
  const people=[...new Set(list.flatMap(f=>[...(info(f).cast||[]),...Object.values(info(f).n||{}),...attori(f),...attrici(f)]).filter(Boolean))].sort();
  const opt=(arr,cur,all)=>`<option value="">${all}</option>`+arr.map(x=>`<option value="${esc(x)}"${String(cur)===String(x)?" selected":""}>${esc(x)}</option>`).join("");
  return `<div class="filters">
    ${withSearch?`<label class="fld wide"><span class="label">Cerca un titolo</span><input id="f-q" type="search" placeholder="Titolo italiano o originale" value="${esc(S.q)}"></label>`:""}
    <label class="fld"><span class="label">Anno</span><select id="f-anno">${opt(years,S.anno,"Tutti")}</select></label>
    <label class="fld"><span class="label">Genere</span><select id="f-genere">${opt(genres,S.genere,"Tutti")}</select></label>
    <label class="fld"><span class="label">Nazionalità</span><select id="f-nazione"${nations.length?"":" disabled"}>${opt(nations,S.nazione,nations.length?"Tutte":"Dati in arrivo")}</select></label>
    <label class="fld"><span class="label">Attore o attrice</span><input id="f-attore" list="dl-people" placeholder="${people.length?"Nome":"Dati in arrivo"}" value="${esc(S.attore)}"><datalist id="dl-people">${people.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></label>
    <label class="fld"><span class="label">Regista</span><input id="f-regista" list="dl-dir" placeholder="Nome" value="${esc(S.regista)}"><datalist id="dl-dir">${directors.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></label>
    <label class="fld"><span class="label">Età consigliata</span><select id="f-eta"><option value="">Qualsiasi</option>${ETA.map(([v,l])=>`<option value="${v}"${S.eta===String(v)?" selected":""}>${v===0?"Per tutti":"Fino a "+l}</option>`).join("")}</select></label>
  </div>`;
}
function bindFilters(root, rerender){
  const map={"f-q":"q","f-anno":"anno","f-genere":"genere","f-nazione":"nazione","f-attore":"attore","f-regista":"regista","f-eta":"eta"};
  for(const [id,key] of Object.entries(map)){
    const el=root.querySelector("#"+id); if(!el) continue;
    const ev=el.tagName==="SELECT"?"change":"input";
    el.addEventListener(ev,()=>{ S[key]=el.value; S.shown=150; rerender(true); });
  }
}
function resetFilters(){ Object.assign(S,{q:"",anno:"",genere:"",nazione:"",attore:"",regista:"",eta:"",shown:150}); }

/* ---------- archivio ---------- */
function rowHTML(f, extra){
  const n=filled(f), pct=Math.round(n/EDIT_CATS.length*100);
  return `<button class="row" data-open="${f.id}">
    <span class="yr">${f.y??"—"}</span>
    <span style="min-width:0"><span class="ttl">${esc(f.t)}${f.o?` <em>${esc(f.o)}</em>`:""}</span>${f.serie||f.type!=="Film"?`<span class="chip">${esc(f.type)}</span>`:""}
      <div class="meta">${esc(f.d||"Regia non indicata")} · ${esc(f.g.join(", "))}${nazioni(f).length?" · "+esc(nazioni(f).join(", ")):""}</div>${extra||""}</span>
    <span class="right"><span class="prog" title="Categorie votate"><i><span style="width:${pct}%"></span></i><small>${n}/${EDIT_CATS.length}</small></span>
      <span class="score" aria-label="Voto">${f.vote??"–"}</span></span>
  </button>`;
}
function sortList(list){
  const s=S.sort;
  const by={voto:(a,b)=>(b.vote??0)-(a.vote??0)||(b.y??0)-(a.y??0), anno:(a,b)=>(b.y??0)-(a.y??0), titolo:(a,b)=>a.t.localeCompare(b.t,"it"), categorie:(a,b)=>filled(b)-filled(a)||(b.vote??0)-(a.vote??0)};
  return list.slice().sort(by[s]);
}
function renderArchivio(keepFocus){
  const el=$("#v-archivio");
  const focusId=keepFocus&&document.activeElement?.id; const caret=document.activeElement?.selectionStart;
  const list=sortList(applyFilters(pool()));
  const all=pool(), votate=all.filter(f=>filled(f)>0).length;
  el.innerHTML=`
    <h2>${S.kind==="serie"?"Le serie che ho visto":"I film che ho visto"}</h2>
    <p class="sub">${all.length} titoli dal tuo archivio IMDb · ${votate} con voti per categoria${dbState==="off"?" · i voti per categoria non sono disponibili in questa vista":""}</p>
    ${filterBar(true)}
    <div class="toolbar"><span class="count">${list.length} risultati</span>
      <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="label" for="f-sort">Ordina</label>
      <select id="f-sort" class="btn"><option value="voto">Per voto</option><option value="anno">Per anno</option><option value="titolo">Per titolo</option><option value="categorie">Più votati per categoria</option></select>
      <button class="btn" id="f-reset">Azzera filtri</button></span></div>
    ${list.length?`<div class="list">${list.slice(0,S.shown).map(f=>rowHTML(f)).join("")}</div>
      ${list.length>S.shown?`<button class="btn more" id="more">Mostra altri ${Math.min(150,list.length-S.shown)} di ${list.length-S.shown}</button>`:""}`
      :`<div class="list"><div class="empty">Nessun titolo corrisponde ai filtri.</div></div>`}`;
  el.querySelector("#f-sort").value=S.sort;
  el.querySelector("#f-sort").onchange=e=>{S.sort=e.target.value;renderArchivio();};
  el.querySelector("#f-reset").onclick=()=>{resetFilters();renderArchivio();};
  el.querySelector("#more")?.addEventListener("click",()=>{S.shown+=150;renderArchivio();});
  bindFilters(el, renderArchivio);
  if(focusId){ const f=el.querySelector("#"+focusId); if(f){ f.focus(); try{ if(caret!=null) f.setSelectionRange(caret,caret);}catch(e){} } }
}

/* ---------- consiglia ---------- */
function renderConsiglia(keepFocus){
  const el=$("#v-consiglia");
  const focusId=keepFocus&&document.activeElement?.id; const caret=document.activeElement?.selectionStart;
  let list=applyFilters(pool());

  const score=f=> picks.length? picks.reduce((s,k)=>s+val(f,k),0)/picks.length : (f.vote??0);

    <div class="toolbar"><span class="count">${list.length} ${list.length===1?"titolo consigliato":"titoli consigliati"}${picks.length?", in ordine di media sulle categorie scelte":", in ordine di voto"}</span><button class="btn" id="c-reset">Azzera tutto</button></div>
    ${list.length?`<div class="list">${list.slice(0,60).map(f=>rowHTML(f, picks.length?`<div class="reason">${picks.map(k=>`${esc(CAT[k].n)} <b>${val(f,k)}</b>`).join(" · ")}</div>`:"")).join("")}</div>`
      :`<div class="list"><div class="empty">${picks.some(k=>k!=="film") && !Object.keys(VOTI).length ? "Le categorie scelte non hanno ancora voti. Apri un film dall'Archivio e inizia a votarle." : "Nessun titolo soddisfa tutti i criteri. Prova ad abbassare un minimo o a togliere un filtro."}</div></div>`}`;
  el.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ const k=b.dataset.pick; S.picks=picks.includes(k)?picks.filter(x=>x!==k):[...picks,k]; renderConsiglia(); });

/* ---------- premi ---------- */
const YEARS=[]; for(let y=1988;y<=2016;y++) YEARS.push(y);
function premio(year, k){
  const a=AW[k], base=a.base||k;
  const films=FILMS.filter(f=>!f.serie && f.y===year && (!a.only || a.only(f)));
  const scored=films.map(f=>({f,v:val(f,base),tb:base==="film"?(avgCats(f)??-1):0})).filter(x=>x.v!=null);
  scored.sort((a,b)=>b.v-a.v||b.tb-a.tb);
  if(!scored.length) return null;
  const top=scored[0];
  const winners=scored.filter(x=>x.v===top.v && x.tb===top.tb);
  const noms=scored.filter(x=>!winners.includes(x)).slice(0,4);
  return {winners,noms};
}
function whoLabel(x,k){ const c=CAT[k]; const w=c.who?who(x.f,k):""; return w ? {main:w, sub:x.f.t} : {main:x.f.t, sub:x.f.d}; }
function awardCard(year,k,top){
  const c=CAT[k], a=AW[k], base=a.base||k, p=premio(year,k);
  let body;
  if(!p) body=`<div class="nowin">${a.none || (k==="film"?"Nessun film di quest'anno nell'archivio.":"Nessun voto ancora in questa categoria.")}</div>`;
  else{
    const W=p.winners.slice(0,4).map(x=>{const l=whoLabel(x,k);return `<div class="win">${STATUE}<div style="min-width:0"><button class="link who" data-open="${x.f.id}">${esc(l.main)}</button><div class="of">${esc(l.sub||"")} · <span class="mono">${x.v}</span></div></div></div>`;}).join("");
    const extra=p.winners.length>4?`<div class="of">e altri ${p.winners.length-4} ex aequo</div>`:"";
    const tie=p.winners.length>1?`<div class="of">Ex aequo${base==="film"?": i voti per categoria faranno da spareggio":""}</div>`:"";
    const N=p.noms.length?`<ul class="noms">${p.noms.map(x=>{const l=whoLabel(x,k);return `<li><span><button class="link" data-open="${x.f.id}">${esc(l.main)}</button>${l.sub&&CAT[k].who&&who(x.f,k)?` <span>(${esc(x.f.t)})</span>`:""}</span><span class="mono">${x.v}</span></li>`;}).join("")}</ul>`:"";
    body=W+extra+tie+N;
  }
  return `<div class="award${top?" top":""}"><div class="cat">${esc(c.n)}</div>${body}</div>`;
}
function renderPremi(){
  const el=$("#v-premi");
  const head=`<h2>I Premi Gmdb</h2><p class="sub">Dal 1988 al 2016. Vince il voto più alto dell'anno in ogni categoria, seguono fino a quattro candidati. Film italiano, Documentario e Animazione premiano il miglior voto «Film» tra i titoli di quel tipo.</p>`;
  const kindNote=S.kind==="serie"?`<p class="note">I premi riguardano solo i film: qui sotto vedi l'albo dei film anche con "Serie TV" selezionato.</p>`:"";
  const seg=`<div style="margin-top:14px" class="seg"><button data-mode="anno" aria-pressed="${S.premiMode==="anno"}">Per anno</button><button data-mode="cat" aria-pressed="${S.premiMode==="cat"}">Per categoria</button></div>`;
  let content;
  if(S.premiMode==="anno"){
    const y=S.premiYear, n=FILMS.filter(f=>!f.serie&&f.y===y).length;
    content=`<div class="years" id="years">${YEARS.map(v=>`<button data-year="${v}" aria-pressed="${v===y}">${v}</button>`).join("")}</div>
      <div class="yearhead"><span class="num">${y}</span><span class="sub">${n} film in gara</span></div>
      <div class="board">${AWARDS.map((c,i)=>awardCard(y,c.k,i===0)).join("")}</div>`;
  } else {
    const k=S.premiCat;
    content=`<div class="filters" style="grid-template-columns:minmax(0,320px)"><label class="fld"><span class="label">Categoria</span><select id="p-cat">${AWARDS.map(c=>`<option value="${c.k}"${c.k===k?" selected":""}>${esc(c.n)}</option>`).join("")}</select></label></div>
      <div class="tablewrap"><table><thead><tr><th>Anno</th><th>Vincitore</th><th>Voto</th><th>Candidati</th></tr></thead><tbody>
      ${YEARS.map(y=>{const p=premio(y,k); if(!p) return `<tr><td class="y">${y}</td><td colspan="3" class="nowin">—</td></tr>`;
        const w=p.winners.slice(0,3).map(x=>{const l=whoLabel(x,k);return `<button class="link" data-open="${x.f.id}"><b>${esc(l.main)}</b></button>${CAT[k].who&&who(x.f,k)?` <span class="meta">${esc(x.f.t)}</span>`:""}`;}).join("<br>")+(p.winners.length>3?`<div class="meta">+${p.winners.length-3} ex aequo</div>`:"");
        return `<tr><td class="y">${y}</td><td>${w}</td><td class="mono">${p.winners[0].v}</td><td class="meta">${p.noms.map(x=>esc(whoLabel(x,k).main)).join(", ")||"—"}</td></tr>`;}).join("")}
      </tbody></table></div>`;
  }
  el.innerHTML=head+kindNote+seg+content;
  el.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.premiMode=b.dataset.mode;renderPremi();});
  el.querySelectorAll("[data-year]").forEach(b=>b.onclick=()=>{S.premiYear=Number(b.dataset.year);renderPremi();});
  el.querySelector("#p-cat")?.addEventListener("change",e=>{S.premiCat=e.target.value;renderPremi();});
  const sel=el.querySelector('#years [aria-pressed="true"]'); if(sel) sel.scrollIntoView({block:"nearest",inline:"center"});
}

/* ---------- scheda ---------- */
function starsHTML(f,c){

function fonteHTML(f,dis){

  return `<div class="castbox" id="fonte-box"><select data-fonte ${dis?"disabled":""} aria-label="Tipo di sceneggiatura"><option value="">Originale o tratta da…?</option><option value="originale"${v==="originale"?" selected":""}>Originale</option><option value="adattata"${v==="adattata"?" selected":""}>Tratta da altra opera</option></select>
    ${v==="adattata"?`<input type="text" id="i-da" ${dis?"disabled":""} placeholder="Tratta da… (es. dal romanzo «…» di …)" value="${esc(da)}" aria-label="Opera di partenza">`:""}
    ${v==="adattata"&&l?`<a class="ibs" href="${ibsURL(l)}" target="_blank" rel="noopener"><span>Il libro: <b>«${esc(l.t)}»</b>${l.a?` di ${esc(l.a)}`:""}</span><span class="buy">Acquista su IBS ↗</span></a>`:""}</div>`;
}
function renderSheet(){
  const box=$("#sheet"); const f=BYID[S.open];
  if(!f){ box.hidden=true; box.innerHTML=""; document.body.style.overflow=""; return; }
  const i=info(f), dis=!canWrite;
    box.hidden=false; document.body.style.overflow="hidden";
  const nat=nazioni(f), fonte=fonteOf(f), da=daOf(f), lib=cred(f).lib;
  const etaLbl = typeof i.eta==="number" ? (i.eta===0?"Per tutti":`Dai ${i.eta} anni`) : "";
  const scen = fonte==="originale" ? "Originale" : fonte==="adattata" ? (da?esc(da.charAt(0).toUpperCase()+da.slice(1)):"Tratta da altra opera")+(lib?` · <a href="${ibsURL(lib)}" target="_blank" rel="noopener">«${esc(lib.t)}» su IBS ↗</a>`:"") : "";
  const facts=[["Sceneggiatura",scen],["Attore",esc(attori(f).slice(0,5).join(", "))],["Attrice",esc(attrici(f).slice(0,5).join(", "))],["Età",etaLbl],["Durata",f.min?`${f.min} minuti`:""]].filter(x=>x[1]);
  const ext=extHTML(f), m=mediaExt(f);
  box.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(f.t)}">
    <div class="sheet-head"><div class="brand"><span class="star" aria-hidden="true"></span><b>GMDB</b></div><span class="no">Scheda ${esc(f.id)}</span><button class="x" id="x" aria-label="Chiudi">✕</button></div>
    <div class="sheet-body">
      ${dis?`<p class="note" style="margin:0">${dbState==="off"?"I voti per categoria non si possono caricare in questa vista.":dbState==="snap"?"Copia in sola lettura di Gmdb.":"Stai guardando la scheda in sola lettura."}</p>`:""}
      <section class="fhead">
        <div class="meta-top"><span>${esc(f.serie?f.type:"Film")}${f.y?` · ${f.y}`:""}</span><span>${[f.min?f.min+" min":"",nat.join(", ")].filter(Boolean).map(esc).join(" · ")}</span></div>
        <h3>${esc(f.t)}</h3>
        ${f.o?`<div class="orig">${esc(f.o)}</div>`:""}
        <div class="by">${[f.d?`Regia di ${esc(f.d)}`:"",esc(f.g.join(", "))].filter(Boolean).join(" · ")}</div>
      </section>
      <section class="top">
        ${f.vote!=null?`<div class="mine"><div class="label">Il mio voto</div><div class="n">${f.vote}<small>/10</small></div><div class="stamp">VISTO</div></div>`:"<div></div>"}
        ${facts.length?`<div><h4 class="sec">Informazioni</h4><dl>${facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>`:""}
      </section>
      ${ext?`<section><h4 class="sec">Voti esterni${m?`<small>la media non conta per classifiche e premi</small>`:""}</h4>${ext}</section>`:""}
      ${extOf(f).yt?`<section><h4 class="sec">Trailer</h4>${trailerHTML(f)}</section>`:""}
      <section><h4 class="sec">I miei voti per categoria</h4><div class="cats">${CATS.map(c=>`
        <div class="c"><div class="nm">${esc(c.n)}${c.h?`<small>${esc(c.h)}</small>`:""}</div>${starsHTML(f,c)}
        ${c.who&&!dis?castHTML(f,c,dis):""}
        ${c.extra==="fonte"&&!dis?fonteHTML(f,dis):""}
        </div>`).join("")}</div></section>
      ${dis?"":`<section><h4 class="sec">Modifica scheda</h4><div class="info">
        <label class="fld"><span class="label">Nazionalità</span><input type="text" id="i-nazione" placeholder="Es. Italia, Francia" value="${esc(nat.join(", "))}"></label>
        <label class="fld"><span class="label">Età consigliata</span><select id="i-eta"><option value="">Non indicata</option>${ETA.map(([v,l])=>`<option value="${v}"${i.eta===v?" selected":""}>${l}</option>`).join("")}</select></label>
      </div></section>`}
    </div></div></div>`;
  const close=()=>{S.open=null;renderSheet();render();};
  bindTrailer(box);
  box.querySelector("#x").onclick=close;
  box.querySelector("#scrim").onclick=e=>{ if(e.target.id==="scrim") close(); };
  box.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.star, v=Number(b.dataset.v); const cur=val(f,k);
    edit(f.id, d=>{ d.v=d.v||{}; if(cur===v) delete d.v[k]; else d.v[k]=v; });
    const row=b.closest(".stars"); row.outerHTML=starsHTML(f,CAT[k]); rebindStars();
  });
  const list=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
  box.querySelectorAll("[data-castlist]").forEach(inp=>inp.oninput=()=>{ const k=inp.dataset.castlist, key=k==="attore"?"attori":"attrici";
    edit(f.id,d=>{ d[key]=list(inp.value).slice(0,5); });
    const sel=box.querySelector(`[data-who="${k}"]`); if(sel){ const cur=who(f,k); sel.innerHTML=castOf(f,k).map(n=>`<option${n===cur?" selected":""}>${esc(n)}</option>`).join(""); } });
  box.querySelectorAll("[data-who]").forEach(sel=>sel.onchange=()=>edit(f.id,d=>{ d.n=d.n||{}; const k=sel.dataset.who; if(sel.value && sel.value!==castOf(f,k)[0]) d.n[k]=sel.value; else delete d.n[k]; }));
  box.querySelector("[data-fonte]")?.addEventListener("change",e=>{ edit(f.id,d=>{ if(e.target.value) d.fonte=e.target.value; else delete d.fonte; }); const w=box.querySelector("#fonte-box"); if(w) w.outerHTML=fonteHTML(f,!canWrite); bindDa(); });
  function bindDa(){ const da=box.querySelector("#i-da"); if(da) da.oninput=()=>edit(f.id,d=>{ d.fonte_da=da.value; }); }
  bindDa();
  box.querySelector("#i-nazione")?.addEventListener("input",e=>edit(f.id,d=>{ d.nazione=list(e.target.value); }));
  box.querySelector("#i-eta")?.addEventListener("change",e=>edit(f.id,d=>{ d.eta = e.target.value==="" ? null : Number(e.target.value); }));
  function rebindStars(){ box.querySelectorAll("[data-star]").forEach(b=>{ if(b._b) return; b._b=1; b.onclick=()=>{
    const k=b.dataset.star, v=Number(b.dataset.v); const cur=val(f,k);
    edit(f.id, d=>{ d.v=d.v||{}; if(cur===v) delete d.v[k]; else d.v[k]=v; });
    b.closest(".stars").outerHTML=starsHTML(f,CAT[k]); rebindStars(); }; }); }
  box.querySelectorAll("[data-star]").forEach(b=>b._b=1);
  box.querySelector("#x").focus();
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.open){S.open=null;renderSheet();render();} });

/* ---------- saving ---------- */
const saving={}, dirty={}, timers={}, pending=new Set();
function edit(id, fn){
  if(!canWrite) return;
  const d=structuredClone(VOTI[id]||{}); fn(d); VOTI[id]=d; pending.add(id);
  clearTimeout(timers[id]); timers[id]=setTimeout(()=>save(id),700);
}
async function save(id){
  if(saving[id]){ dirty[id]=true; return; }
  saving[id]=true;
  try{ await db.doc("film/"+id).set(structuredClone(VOTI[id])); toast("Salvato"); }
  catch(e){ if(e?.code==="invalid_argument"){ canWrite=false; toast("Non hai i permessi per modificare: scheda in sola lettura"); renderSheet(); }
            else if(e?.code==="quota_exceeded") toast("Archivio pieno: non posso salvare altre schede");
            else toast("Salvataggio non riuscito, riprova tra poco"); }
  saving[id]=false;
  if(dirty[id]){ dirty[id]=false; save(id); } else pending.delete(id);
}

/* ---------- routing ---------- */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  for(const t of ["archivio","premi","consiglia"]) $("#v-"+t).hidden=t!==S.tab;
  ({archivio:renderArchivio,premi:renderPremi,consiglia:renderConsiglia})[S.tab]();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});
$("#kind").value=S.kind;
$("#kind").onchange=e=>{ S.kind=e.target.value; resetFilters(); try{localStorage.setItem("gmdb-kind",S.kind);}catch(_){}; render(); };
document.addEventListener("click",e=>{ const o=e.target.closest("[data-open]"); if(o && !o.closest(".sheet")){ S.open=o.dataset.open; renderSheet(); } });
const h=(location.hash||"").slice(1); if(["archivio","premi","consiglia"].includes(h)) S.tab=h;
render();

/* ---------- data ---------- */
(async()=>{
  const cl=window.claude;
  if(!cl?.use){ const S0=window.GMDB_SNAPSHOT; if(S0){ for(const [k,v] of Object.entries(S0.ext||{})) EXT[k]={...(EXT[k]||{}),...v}; VOTI=S0.film||{}; dbState="snap"; } else dbState="off"; render(); if(S.open) renderSheet(); return; }
  const [d,u]=await Promise.all([cl.use("db"),cl.use("user")]);
  if(!d){ dbState="off"; render(); return; }
  db=d;
  if(u){ canWrite = await u.canEdit(); }
  db.collection("ext").onSnapshot(snap=>{ snap.docs.forEach(doc=>{ if(doc.exists) EXT[doc.id]={...(EXT[doc.id]||{}),...doc.data()}; }); render(); });
  db.collection("film").onSnapshot(snap=>{
    const next={}; snap.docs.forEach(doc=>{ if(doc.exists) next[doc.id]=doc.data(); });
    for(const id of pending){ if(VOTI[id]) next[id]=VOTI[id]; }
    VOTI=next; dbState="on";
    if(!S.open) render();
  },()=>{ dbState="off"; render(); });
  dbState="on"; render(); if(S.open) renderSheet();
})();
</script>


</body></html>
